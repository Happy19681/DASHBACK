services:
  - type: web
    name: dashboard-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DASHBOARD_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://dashfront-6f6c.onrender.com
      - key: MONGO_DATABASE
        value: Dashboard-DB
      - key: MONGO_COLLECTION
        value: Transactions
      - key: PORT
        value: "10000"
